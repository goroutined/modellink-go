name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: go generate ./...
      - name: Check generated files
        run: git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check for a newer ModelLink schema
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: go run ./internal/cmd/schemacheck
